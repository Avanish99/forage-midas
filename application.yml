general:
  kafka-topic: trader-updates

server:
  port: 33400

spring:
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: midas-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
  datasource:
    url: jdbc:h2:mem:midasdb       # in-memory H2 database
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true                # enable H2 web console
      path: /h2-console            # access at http://localhost:8080/h2-console
  jpa:
    hibernate:
      ddl-auto: update             # create/update tables automatically
    show-sql: true                 # log SQL statements
    database-platform: org.hibernate.dialect.H2Dialect
